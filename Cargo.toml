[package]
name = "relay"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Relay local MCP bridge and VS Code workspace server"

[[bin]]
name = "relay-bridge"
path = "src/bin/relay-bridge.rs"

[[bin]]
name = "relay-workspace"
path = "src/bin/workspace-tools.rs"

[[bin]]
name = "relayctl"
path = "src/bin/relayctl.rs"

[dependencies]
anyhow = "1"
dirs = "6"
futures-util = "0.3"
globset = "0.4"
regex = "1"
rand = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
url = "2"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
